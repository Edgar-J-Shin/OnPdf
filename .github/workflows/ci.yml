name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 배포 타깃 Windows·macOS 는 Qt 앱까지 빌드·테스트한다 (dev-app). Linux 는 core 만.
          - { name: windows-x64, os: windows-latest, pdfium: win-x64,   preset: dev-app, qt: true }
          - { name: macos-arm64, os: macos-latest,   pdfium: mac-arm64, preset: dev-app, qt: true }
          - { name: linux-x64,   os: ubuntu-latest,  pdfium: linux-x64, preset: dev,     qt: false }

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 릴리스와 같은 공식 Qt 6.11.x (#108, #159). 6.8 의 macOS 바이너리는 SDK 에서 빠진 AGL 을 링크해 실패했고 6.9 에서
      # 고쳐졌다. 6.9 는 2026-03-31 지원 종료, 6.12 LTS 는 macOS 14 이상이라 최소 13 을 지키는 마지막 판이 6.11 이다
      - name: Install Qt
        if: matrix.qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true

      # vcpkg 바이너리 캐시 (qpdf·zlib·libjpeg-turbo 소스 빌드를 매번 반복하지 않게). vcpkg 의 x-gha 백엔드는 제거됐으므로
      # files 백엔드 디렉터리를 actions/cache 로 보존한다
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-
      - name: Prepare vcpkg binary cache dir
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform ${{ matrix.pdfium }}

      # 왕복 코퍼스 (#119): 목록(corpus.tsv)이 바뀔 때만 다시 받고 그 밖에는 캐시 — 스크립트는 sha256 만 확인한다
      - name: Restore round-trip corpus
        uses: actions/cache@v4
        with:
          path: testdata/corpus
          key: corpus-${{ hashFiles('testdata/corpus.tsv', 'testdata/gen/fetch_corpus.py') }}
      - name: Fetch round-trip corpus
        run: python3 testdata/gen/fetch_corpus.py

      - name: Check testdata is up to date
        if: runner.os == 'Linux'
        run: python3 testdata/gen/make_all.py --check

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          QT_QPA_PLATFORM: offscreen
          ONPDF_CORPUS_REQUIRED: 1  # 코퍼스 파일이 빠지면 SKIP 이 아니라 실패 (#119)

  app:
    name: app-linux (Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.11.*"
          cache: true
      # vcpkg 바이너리 캐시 (qpdf·zlib·libjpeg-turbo 소스 빌드를 매번 반복하지 않게). vcpkg 의 x-gha 백엔드는 제거됐으므로
      # files 백엔드 디렉터리를 actions/cache 로 보존한다
      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-app-linux-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-app-linux-
      - name: Prepare vcpkg binary cache dir
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/vcpkg_cache"
          echo "VCPKG_BINARY_SOURCES=clear;files,${{ github.workspace }}/vcpkg_cache,readwrite" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform linux-x64
      - name: Configure
        run: cmake --preset dev-app
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset dev-app
      - name: Test
        run: ctest --preset dev-app
        env:
          QT_QPA_PLATFORM: offscreen
