name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, pdfium: win-x64 }
          - { name: macos-arm64, os: macos-latest,   pdfium: mac-arm64 }
          - { name: linux-x64,   os: ubuntu-latest,  pdfium: linux-x64 }

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform ${{ matrix.pdfium }}

      - name: Configure
        run: cmake --preset dev

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        run: ctest --preset dev

  app:
    name: app-linux (Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform linux-x64
      - name: Configure
        run: cmake --preset dev-app
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset dev-app
      - name: Test
        run: ctest --preset dev-app
        env:
          QT_QPA_PLATFORM: offscreen
