name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 주 타깃 Windows 는 Qt 앱까지 빌드·테스트한다 (dev-app). 나머지는 core 만.
          - { name: windows-x64, os: windows-latest, pdfium: win-x64,   preset: dev-app, qt: true }
          - { name: macos-arm64, os: macos-latest,   pdfium: mac-arm64, preset: dev,     qt: false }
          - { name: linux-x64,   os: ubuntu-latest,  pdfium: linux-x64, preset: dev,     qt: false }

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        if: matrix.qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform ${{ matrix.pdfium }}

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          QT_QPA_PLATFORM: offscreen

  app:
    name: app-linux (Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform linux-x64
      - name: Configure
        run: cmake --preset dev-app
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset dev-app
      - name: Test
        run: ctest --preset dev-app
        env:
          QT_QPA_PLATFORM: offscreen
