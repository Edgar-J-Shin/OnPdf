name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 배포 타깃 Windows·macOS 는 Qt 앱까지 빌드·테스트한다 (dev-app). Linux 는 core 만.
          - { name: windows-x64, os: windows-latest, pdfium: win-x64,   preset: dev-app, qt: true }
          - { name: macos-arm64, os: macos-latest,   pdfium: mac-arm64, preset: dev-app, qt: true }
          - { name: linux-x64,   os: ubuntu-latest,  pdfium: linux-x64, preset: dev,     qt: false }

    steps:
      - uses: actions/checkout@v4

      - uses: lukka/get-cmake@latest

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt (Windows)
        if: matrix.qt && runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true

      # macOS: install-qt-action 의 6.8 사전 빌드는 Xcode 16 SDK 에서 제거된 AGL 프레임워크를 링크해
      # 실패한다. 개발 머신과 같은 Homebrew Qt 를 쓴다.
      - name: Install Qt (Homebrew)
        if: matrix.qt && runner.os == 'macOS'
        run: |
          brew install qt
          echo "QT_ROOT_DIR=$(brew --prefix qt)" >> "$GITHUB_ENV"

      # vcpkg 바이너리 캐시 (qpdf·zlib·libjpeg-turbo 소스 빌드를 매번 반복하지 않게). GitHub Actions 캐시 백엔드
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform ${{ matrix.pdfium }}

      - name: Check testdata is up to date
        if: runner.os == 'Linux'
        run: python3 testdata/gen/make_all.py --check

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        env:
          QT_QPA_PLATFORM: offscreen

  app:
    name: app-linux (Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.*"
          cache: true
      # vcpkg 바이너리 캐시 (qpdf·zlib·libjpeg-turbo 소스 빌드를 매번 반복하지 않게). GitHub Actions 캐시 백엔드
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
            core.exportVariable('VCPKG_BINARY_SOURCES', 'clear;x-gha,readwrite');

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json
      - name: Fetch PDFium
        run: python3 third_party/fetch_pdfium.py --platform linux-x64
      - name: Configure
        run: cmake --preset dev-app
        env:
          QT_ROOT: ${{ env.QT_ROOT_DIR }}
      - name: Build
        run: cmake --build --preset dev-app
      - name: Test
        run: ctest --preset dev-app
        env:
          QT_QPA_PLATFORM: offscreen
